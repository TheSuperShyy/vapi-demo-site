<!doctype html>
<html lang="he" dir="rtl" translate="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Chrome was auto-translating this page to English, which rewrites the Hebrew
     text nodes and would mangle the live transcript as it renders. -->
<meta name="google" content="notranslate">
<title>מטה קול העם · סוכן קולי בעברית</title>
<meta name="description" content="הדגמה חיה של סוכן קולי בעברית. לוחצים, מדברים, שומעים תשובה.">
<link rel="stylesheet" href="design-system/styles.css">
<link rel="stylesheet" href="design-system/components.css">
<style>
  * { box-sizing:border-box; }
  html,body { height:100%; }
  body {
    display:flex; flex-direction:column; align-items:center;
    padding:32px 20px 40px; gap:24px;
  }

  .brand { font-size:13px; letter-spacing:0; color:var(--text-3); font-weight:500; }
  h1 { font-size:clamp(26px,5vw,38px); margin:0; text-align:center; font-weight:700; line-height:1.25; }
  .sub { color:var(--text-2); text-align:center; max-width:44ch; margin:0; font-size:15px; line-height:1.7; }

  .stage {
    width:100%; max-width:620px; background:var(--surface-1); border:1px solid var(--border-1);
    border-radius:var(--radius-lg); padding:30px 24px; display:flex; flex-direction:column;
    align-items:center; gap:18px;
  }

  .orb { position:relative; width:132px; height:132px; display:grid; place-items:center; }
  .ring {
    position:absolute; inset:0; border-radius:50%; border:2px solid var(--border-1);
    pointer-events:none;  /* decorative overlay - must never swallow clicks on the button */
    transition:transform .12s ease-out, border-color .3s, opacity .3s;
  }
  .orb.live .ring { border-color:var(--positive); }
  .orb.speaking .ring { border-color:var(--accent); }
  .mic {
    width:96px; height:96px; border-radius:50%; border:none; cursor:pointer;
    background:var(--accent); color:var(--accent-fg); font-family:var(--font-ui); font-size:15px;
    font-weight:700; transition:background .2s, transform .1s;
  }
  .mic:hover { background:var(--accent-hover); }
  .mic:active { transform:scale(.96); }
  .mic:disabled { background:var(--surface-3); color:var(--text-3); cursor:default; }
  .orb.live .mic { background:var(--negative); }
  .orb.live .mic:hover { background:var(--negative); }

  .state { font-size:14px; color:var(--text-2); min-height:22px; text-align:center; }
  .state b { color:var(--text-1); font-weight:500; }

  .feed {
    width:100%; max-height:300px; overflow-y:auto; display:flex; flex-direction:column;
    gap:8px; padding-top:6px;
  }
  .feed:empty { display:none; }
  .turn { display:flex; }
  .turn.me { justify-content:flex-start; }
  .turn.bot { justify-content:flex-end; }
  .bubble {
    max-width:82%; padding:9px 13px; border-radius:var(--radius-md); font-size:14.5px; line-height:1.6;
    background:var(--surface-2); border:1px solid var(--border-1);
  }
  .turn.me .bubble { background:var(--accent-soft); border-color:transparent; }
  .bubble.partial { opacity:.55; }
  .who { font-size:10px; letter-spacing:1px; color:var(--text-3); margin-bottom:2px; }

  .note {
    color:var(--text-3); font-size:12.5px; text-align:center; max-width:46ch;
    line-height:1.7; margin:0;
  }
  .err { color:var(--negative); font-size:13.5px; text-align:center; min-height:20px; }

  .voicepick {
    display:flex; align-items:center; gap:10px; flex-wrap:wrap; justify-content:center;
    font-size:12.5px; color:var(--text-3); width:100%;
  }
  .voicepick select, .voicepick input[type=range] { font:inherit; }
  .voicepick select {
    background:var(--bg-0); color:var(--text-1); border:1px solid var(--border-1);
    border-radius:6px; padding:5px 8px; font-size:13px;
  }
  .voicepick input[type=range] { width:110px; accent-color:var(--accent); }
  .speedval { font-family:ui-monospace,Menlo,Consolas,monospace; min-width:34px; }

  .chatbar { display:flex; gap:8px; width:100%; }
  .chatbar input {
    flex:1; font:inherit; font-size:14.5px; color:var(--text-1); background:var(--bg-0);
    border:1px solid var(--border-1); border-radius:var(--radius-pill); padding:10px 13px;
  }
  .chatbar input:focus { outline:none; border-color:var(--accent); }
  .chatbar input:disabled { opacity:.45; }
  .chatbar button {
    font:inherit; font-weight:700; font-size:14px; color:var(--accent-fg); background:var(--accent);
    border:none; border-radius:var(--radius-pill); padding:0 18px; cursor:pointer;
  }
  .chatbar button:hover:not(:disabled) { background:var(--accent-hover); }
  .chatbar button:disabled { background:var(--surface-3); color:var(--text-3); cursor:default; }
  /* Hidden unless the page is opened with ?debug - keeps the demo clean but leaves
     a one-URL way to see exactly where a failure happens. */
  .diag { display:none; font-family:ui-monospace,Menlo,Consolas,monospace; font-size:11.5px; color:var(--text-3);
          direction:ltr; text-align:left; width:100%; max-height:130px; overflow-y:auto;
          white-space:pre-wrap; word-break:break-word; }
  footer { color:var(--text-3); font-size:12px; text-align:center; }
  footer a { color:var(--text-2); }
</style>
</head>
<body>

<div class="brand">מטה קול העם</div>
<h1>סוכן קולי שמדבר עברית</h1>
<p class="sub">לוחצים על הכפתור, מדברים כרגיל, והסוכן עונה בקול. בלי טפסים, בלי המתנה — פשוט שיחה.</p>

<div class="stage">
  <div class="orb" id="orb">
    <div class="ring" id="ring"></div>
    <button class="mic" id="mic">דבר איתי</button>
  </div>
  <div class="state" id="state">מוכן. צריך אישור למיקרופון.</div>
  <div class="err" id="err"></div>
  <div class="diag" id="diag"></div>

  <div class="voicepick" id="voicepick">
    <label for="voice">קול</label>
    <select id="voice"></select>
    <label for="speed">קצב</label>
    <input type="range" id="speed" min="0.75" max="1.25" step="0.05" value="1">
    <span class="speedval" id="speedval">1.00</span>
  </div>

  <div class="feed notranslate" id="feed" translate="no"></div>

  <form class="chatbar" id="chatbar" autocomplete="off">
    <input type="text" id="chatinput" dir="auto"
           placeholder="…או פשוט תכתוב פה. You can type in English too"
           disabled>
    <button type="submit" id="chatsend" disabled>שלח</button>
  </form>
</div>

<p class="note">
  אפשר לדבר דרך המיקרופון או פשוט לכתוב. כותבים באנגלית — עונה בעברית.
  השיחה רצה בדפדפן, לא מתקשרים אליך. עובד הכי טוב בכרום.
</p>

<footer>הדגמה טכנית · <a href="https://vapi.ai" target="_blank" rel="noopener">Vapi</a></footer>

<script>
// Classic script: runs even if the module below fails to load, so errors are visible
// on the page instead of only in the console.
window.__log = (m) => {
  const d = document.getElementById('diag');
  if (d) d.textContent += (d.textContent ? String.fromCharCode(10) : String()) + m;
  console.log('[demo]', m);
};
window.addEventListener('error', (e) => {
  window.__log('ERROR: ' + (e.message || e.error) + (e.filename ? '  @ ' + e.filename : ''));
});
window.addEventListener('unhandledrejection', (e) => {
  window.__log('UNHANDLED: ' + (e.reason?.message || JSON.stringify(e.reason)));
});
if (location.search.includes('debug')) {
  document.getElementById('diag').style.display = 'block';
}
window.__log('page loaded, origin=' + location.origin);
</script>

<script type="module">
// Dynamic import so a CDN/network failure is catchable and reportable instead of
// killing the whole module silently (which leaves the button with no handler).
let Vapi;
try {
  window.__log('importing SDK...');
  // Vendored under ./vendor so no CDN is involved: ad blockers, corporate filters
  // and offline machines all broke the jsDelivr import silently.
  const mod = await import('./vendor/vapi.js');
  // The jsDelivr +esm build wraps the CJS default twice, so `mod.default` is an
  // object holding the real class rather than the class itself. Unwrap defensively.
  Vapi = mod.default?.default ?? mod.default ?? mod.Vapi ?? mod;
  if (typeof Vapi !== 'function') throw new Error('SDK export is ' + typeof Vapi + ', not a constructor');
  window.__log('SDK loaded, typeof=' + typeof Vapi);
} catch (e) {
  window.__log('SDK IMPORT FAILED: ' + e.message);
  document.getElementById('diag').style.display = 'block';
  document.getElementById('err').textContent = 'לא הצלחנו לטעון את מנוע השיחה.';
  throw e;
}

// A Vapi PUBLIC key is designed to ship to the browser - it can only start calls
// against this account's assistants. The private key never appears here.
const PUBLIC_KEY  = '4df49a36-752b-4b2e-aca6-ced85264660d';
const ASSISTANT_ID = '47e67fec-8dc1-45e5-a1ef-3f91e8a0e7c6';

const $ = (id) => document.getElementById(id);
const orb = $('orb'), mic = $('mic'), state = $('state'), feed = $('feed'), err = $('err');
const chatinput = $('chatinput'), chatsend = $('chatsend');

// Voice candidates. Vapi does not support ElevenLabs v3 yet and Hebrew exists only in
// v3, so 11labs is not an option here - Azure's he-IL voices are the native ones.
// The OpenAI entries speak Hebrew with a foreign accent but noticeably looser prosody,
// which some people read as more human. Judge by ear.
const VOICES = [
  { id: 'azure:he-IL-HilaNeural',  label: 'הילה · Azure (נקבה, ילידי)',  provider: 'azure',  voiceId: 'he-IL-HilaNeural' },
  { id: 'azure:he-IL-AvriNeural',  label: 'אברי · Azure (זכר, ילידי)',   provider: 'azure',  voiceId: 'he-IL-AvriNeural' },
  { id: 'vapi:Naina',               label: 'נאינה · Vapi (נקבה)',        provider: 'vapi',   voiceId: 'Naina', extra: { version: '2', language: 'he' } },
  { id: 'openai:shimmer',          label: 'Shimmer · OpenAI (נקבה)',     provider: 'openai', voiceId: 'shimmer' },
  { id: 'openai:nova',             label: 'Nova · OpenAI (נקבה)',        provider: 'openai', voiceId: 'nova' },
  { id: 'openai:alloy',            label: 'Alloy · OpenAI (ניטרלי)',     provider: 'openai', voiceId: 'alloy' },
];

const voiceSel = $('voice');
voiceSel.innerHTML = VOICES.map(v => `<option value="${v.id}">${v.label}</option>`).join('');
// Remember the pick between reloads so A/B testing voices is not tedious.
try { voiceSel.value = localStorage.getItem('voice') || VOICES[0].id; } catch {}
voiceSel.onchange = () => { try { localStorage.setItem('voice', voiceSel.value); } catch {} };

const speed = $('speed'), speedval = $('speedval');
try { speed.value = localStorage.getItem('speed') || '1'; } catch {}
const showSpeed = () => { speedval.textContent = Number(speed.value).toFixed(2); };
showSpeed();
speed.oninput = () => { showSpeed(); try { localStorage.setItem('speed', speed.value); } catch {} };

// Voice is per-call, so overrides let you switch without redeploying the assistant.
function voiceOverride() {
  const v = VOICES.find(x => x.id === voiceSel.value) ?? VOICES[0];
  return {
    provider: v.provider,
    voiceId: v.voiceId,
    ...v.extra,                       // e.g. Vapi voices take a language hint
    speed: Number(speed.value),
    // Vapi's formatter strips Hebrew niqqud before it reaches the voice engine, which
    // would kill every pronunciation distinction the prompt depends on.
    chunkPlan: { formatPlan: { enabled: false } },
  };
}

const vapi = new Vapi(PUBLIC_KEY);
// Debug-only handle so pronunciation can be A/B tested from the console:
//   __vapi.say('מַטֵּה קוֹל הָעָם')   then read the transcript to hear what came out.
if (location.search.includes('debug')) window.__vapi = vapi;
window.__log('Vapi instance created, handlers attached');
let live = false;
let partial = null;

function setState(text) { state.innerHTML = text; }
function fail(msg) { err.textContent = msg; }

function bubble(role, text, isPartial) {
  const turn = document.createElement('div');
  turn.className = 'turn ' + (role === 'user' ? 'me' : 'bot');
  turn.innerHTML =
    `<div class="bubble${isPartial ? ' partial' : ''}">
       <div class="who">${role === 'user' ? 'אתה' : 'נועה'}</div>
       <div class="say"></div>
     </div>`;
  turn.querySelector('.say').textContent = text;
  feed.appendChild(turn);
  feed.scrollTop = feed.scrollHeight;
  return turn;
}

mic.onclick = async () => {
  window.__log('click (live=' + live + ')');
  err.textContent = '';
  if (live) { vapi.stop(); return; }
  mic.disabled = true;
  setState('מתחבר…');
  try {
    const ov = { voice: voiceOverride() };
    window.__log('starting call with voice=' + ov.voice.provider + '/' + ov.voice.voiceId + ' speed=' + ov.voice.speed);
    const r = await vapi.start(ASSISTANT_ID, ov);
    window.__log('start() resolved: ' + (r?.id ?? JSON.stringify(r)?.slice(0, 120)));
  } catch (e) {
    window.__log('START FAILED: ' + (e?.message ?? JSON.stringify(e)));
    mic.disabled = false;
    setState('מוכן. צריך אישור למיקרופון.');
    fail(e?.message?.includes('Permission') || e?.name === 'NotAllowedError'
      ? 'הדפדפן חסם את המיקרופון. אשר גישה ונסה שוב.'
      : 'לא הצלחנו להתחיל את השיחה. נסה לרענן.');
  }
};

vapi.on('call-start', () => {
  window.__log('event: call-start');
  live = true;
  mic.disabled = false;
  mic.textContent = 'סיים';
  orb.classList.add('live');
  setState('<b>מחובר</b> — דבר או כתוב');
  feed.innerHTML = '';
  chatinput.disabled = false;
  chatsend.disabled = false;
  voiceSel.disabled = true;   // voice is fixed for the duration of a call
  speed.disabled = true;
});

vapi.on('call-end', () => {
  window.__log('event: call-end');
  live = false;
  mic.disabled = false;
  mic.textContent = 'דבר איתי';
  orb.classList.remove('live', 'speaking');
  $('ring').style.transform = '';
  setState('השיחה הסתיימה. אפשר להתחיל שוב.');
  chatinput.disabled = true;
  chatsend.disabled = true;
  voiceSel.disabled = false;
  speed.disabled = false;
});

// Typing goes into the same live conversation as speech: the message is injected as a
// user turn and the agent answers out loud, in Hebrew, whatever language you typed in.
$('chatbar').onsubmit = (e) => {
  e.preventDefault();
  const text = chatinput.value.trim();
  if (!text || !live) return;
  window.__log('sending typed message: ' + text.slice(0, 60));
  partial?.remove();
  partial = null;
  bubble('user', text, false);
  vapi.send({ type: 'add-message', message: { role: 'user', content: text } });
  chatinput.value = '';
};

vapi.on('speech-start', () => orb.classList.add('speaking'));
vapi.on('speech-end',   () => orb.classList.remove('speaking'));

// Volume drives the ring so there is visible feedback that the mic is actually open.
vapi.on('volume-level', (v) => {
  $('ring').style.transform = `scale(${1 + Math.min(v, 1) * 0.22})`;
});

vapi.on('message', (m) => {
  if (m.type !== 'transcript' || !m.transcript) return;
  if (m.transcriptType === 'partial') {
    if (partial && partial.dataset.role === m.role) {
      partial.querySelector('.say').textContent = m.transcript;
    } else {
      partial?.remove();
      partial = bubble(m.role, m.transcript, true);
      partial.dataset.role = m.role;
    }
  } else {
    partial?.remove();
    partial = null;
    bubble(m.role, m.transcript, false);
  }
});

vapi.on('error', (e) => {
  console.error(e);
  window.__log('event: error -> ' + (e?.message ?? e?.error?.message ?? JSON.stringify(e)?.slice(0,200)));
  fail('נפלה שגיאה בשיחה. נסה שוב.');
  live = false;
  mic.disabled = false;
  mic.textContent = 'דבר איתי';
  orb.classList.remove('live', 'speaking');
});
</script>
</body>
</html>
