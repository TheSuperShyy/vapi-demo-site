<!doctype html>
<html lang="en" dir="ltr" translate="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="google" content="notranslate">
<title>CLIX — Voice Agent</title>
<link rel="stylesheet" href="design-system/styles.css">
<link rel="stylesheet" href="design-system/components.css">
<link rel="stylesheet" href="app.css">
</head>
<body>

<div class="shell">

  <aside class="sidebar">
    <div class="wordmark">CL<b>IX</b></div>
    <div class="greeting">
      <div class="greeting-title" data-i18n="greeting.title">Welcome</div>
      <div class="greeting-sub" data-i18n="greeting.sub">Here's what's happening with your agent</div>
    </div>

    <div class="nav-section" data-i18n="nav.main">Main Menu</div>
    <a class="nav-item" href="#/overview" data-route="overview">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
      <span data-i18n="nav.overview">Overview</span>
    </a>
    <a class="nav-item" href="#/calls" data-route="calls">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg>
      <span data-i18n="nav.calls">Calls</span>
    </a>
    <a class="nav-item" href="#/agent" data-route="agent">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0"/><path d="M12 17v4"/><path d="M8 21h8"/></svg>
      <span data-i18n="nav.agent">Voice Agent</span>
    </a>

    <div class="nav-section" data-i18n="nav.system">System</div>
    <a class="nav-item" href="#/settings" data-route="settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3h0a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5h0a1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9v0a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      <span data-i18n="nav.settings">Settings</span>
    </a>

    <div class="sidebar-foot">
      <button class="btn secondary" id="langbtn" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><path d="m5 8 6 6"/><path d="m4 14 6-6 2-3"/><path d="M2 5h12"/><path d="M7 2h1"/><path d="m22 22-5-10-5 10"/><path d="M14 18h6"/></svg>
        <span id="langlabel">עברית</span>
      </button>
    </div>
  </aside>

  <div class="content">
    <header class="topbar">
      <div class="topbar-left">
        <div class="tabs" id="rangetabs" hidden>
          <button data-range="7">7d</button>
          <button data-range="30">30d</button>
          <button data-range="90">90d</button>
        </div>
      </div>
      <div class="topbar-center">
        <label class="input" style="width:360px">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="search" type="search" data-i18n-placeholder="search.placeholder" placeholder="Search calls" autocomplete="off">
        </label>
      </div>
      <div class="topbar-right">
        <span class="faint" style="font-size:11px" data-i18n="topbar.light">Light</span>
        <span class="switch" id="themeswitch" role="switch" aria-checked="false" tabindex="0"><span></span></span>
        <button class="icon-btn" id="refreshbtn" type="button" data-i18n-title="topbar.refresh" title="Refresh">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg>
        </button>
        <div class="profile">
          <span class="avatar" id="avatar">SH</span>
          <div>
            <div class="profile-name" id="agentname">—</div>
            <div class="profile-sub" data-i18n="profile.sub">Voice agent</div>
          </div>
        </div>
      </div>
    </header>

    <main class="main" id="main">
      <div class="page-empty" data-i18n="loading">Loading…</div>
    </main>
  </div>

</div>

<script type="module" src="app.js"></script>
</body>
</html>
