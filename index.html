<!doctype html>
<html lang="en" dir="ltr" translate="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="google" content="notranslate">
<title>Voice of the People Headquarters · Voice Agent</title>
<link rel="stylesheet" href="design-system/styles.css">
<link rel="stylesheet" href="design-system/components.css">
<link rel="stylesheet" href="app.css">
</head>
<body>

<div class="shell">

  <aside class="sidebar">
    <div class="wordmark"><b>Voice of the People</b> Headquarters</div>
    <div class="greeting">
      <div class="greeting-title" data-i18n="greeting.title">Welcome</div>
      <div class="greeting-sub" data-i18n="greeting.sub">Here's what's happening with your agent</div>
    </div>

    <div class="nav-section" data-i18n="nav.main">Main Menu</div>
    <a class="nav-item" href="#/overview" data-route="overview">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
      <span data-i18n="nav.overview">Overview</span>
    </a>
    <a class="nav-item" href="#/calls" data-route="calls">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg>
      <span data-i18n="nav.calls">Calls</span>
    </a>
    <a class="nav-item" href="#/list" data-route="list">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13"/><path d="M8 12h13"/><path d="M8 18h13"/><path d="M3 6h.01"/><path d="M3 12h.01"/><path d="M3 18h.01"/></svg>
      <span data-i18n="nav.list">List</span>
    </a>
    <a class="nav-item" href="#/agent" data-route="agent">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0"/><path d="M12 17v4"/><path d="M8 21h8"/></svg>
      <span data-i18n="nav.agent">Voice Agent</span>
    </a>

    <div class="nav-section" data-i18n="nav.system">System</div>
    <a class="nav-item" href="#/settings" data-route="settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3h0a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5h0a1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9v0a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      <span data-i18n="nav.settings">Settings</span>
    </a>
    <a class="nav-item" href="#" id="nav-signout" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg>
      <span data-i18n="nav.signout">Sign out</span>
    </a>

    <div class="sidebar-foot">
      <button class="btn secondary" id="langbtn" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><path d="m5 8 6 6"/><path d="m4 14 6-6 2-3"/><path d="M2 5h12"/><path d="M7 2h1"/><path d="m22 22-5-10-5 10"/><path d="M14 18h6"/></svg>
        <span id="langlabel">עברית</span>
      </button>
    </div>
  </aside>

  <div class="content">
    <header class="topbar">
      <div class="topbar-left">
        <div class="tabs" id="rangetabs" hidden>
          <button data-range="7">7d</button>
          <button data-range="30">30d</button>
          <button data-range="90">90d</button>
        </div>
      </div>
      <div class="topbar-center">
        <label class="input">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="search" type="search" data-i18n-placeholder="search.placeholder" placeholder="Search calls" autocomplete="off">
        </label>
      </div>
      <div class="topbar-right">
        <span class="faint" style="font-size:11px" data-i18n="topbar.light">Light</span>
        <span class="switch" id="themeswitch" data-theme-switch role="switch" aria-checked="false" tabindex="0"><span></span></span>
        <button class="icon-btn" id="refreshbtn" type="button" data-i18n-title="topbar.refresh" title="Refresh">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg>
        </button>
        <div class="profile">
          <span class="avatar" id="avatar">SH</span>
          <div>
            <div class="profile-name" id="agentname">—</div>
            <div class="profile-sub" data-i18n="profile.sub">Voice agent</div>
          </div>
        </div>
      </div>
    </header>

    <main class="main" id="main">
      <!-- Static skeleton so the very first paint is already a skeleton, before app.js runs. -->
      <div><div class="skeleton skel-line w30" style="height:20px"></div><div class="skeleton skel-line w50"></div></div>
      <div class="stat-row">
        <div class="stat hero"><div class="skeleton skel-line w50"></div><div class="skeleton skel-line w30"></div><div class="skeleton skel-line w70"></div></div>
        <div class="stat"><div class="skeleton skel-line w50"></div><div class="skeleton skel-line w30"></div></div>
        <div class="stat"><div class="skeleton skel-line w50"></div><div class="skeleton skel-line w30"></div></div>
        <div class="stat"><div class="skeleton skel-line w50"></div><div class="skeleton skel-line w30"></div></div>
        <div class="stat"><div class="skeleton skel-line w50"></div><div class="skeleton skel-line w30"></div></div>
      </div>
      <div class="card"><div class="skeleton skel-line w30"></div><div class="skeleton skel-block" style="margin-top:16px"></div></div>
    </main>
  </div>

</div>

<!-- Phones: the sidebar is hidden and these five take its place along the bottom. -->
<nav class="tabbar" id="tabbar" aria-label="Main">
      <a class="nav-item" href="#/overview" data-route="overview">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
      <span data-i18n="nav.overview">Overview</span>
      </a>
      <a class="nav-item" href="#/calls" data-route="calls">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg>
      <span data-i18n="nav.calls">Calls</span>
      </a>
      <a class="nav-item" href="#/list" data-route="list">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13"/><path d="M8 12h13"/><path d="M8 18h13"/><path d="M3 6h.01"/><path d="M3 12h.01"/><path d="M3 18h.01"/></svg>
      <span data-i18n="nav.list">List</span>
      </a>
      <a class="nav-item" href="#/agent" data-route="agent">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0"/><path d="M12 17v4"/><path d="M8 21h8"/></svg>
      <span data-i18n="nav.agent">Voice Agent</span>
      </a>
      <a class="nav-item" href="#/settings" data-route="settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3h0a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5h0a1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9v0a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      <span data-i18n="nav.settings">Settings</span>
      </a>
</nav>

<!-- Login. Shown only when the server says a dashboard password is in force. -->
<div class="login" id="login" hidden>
  <form class="card login-card" id="login-form" novalidate>
    <div class="wordmark login-mark"><b>Voice of the People</b> Headquarters</div>
    <h1 class="login-title" data-i18n="login.title">Sign in</h1>
    <p class="login-sub" data-i18n="login.sub">Enter the dashboard password</p>

    <label class="input lg login-field">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      <input id="login-pw" type="password" autocomplete="current-password" data-i18n-placeholder="login.placeholder" placeholder="Password" spellcheck="false">
      <button class="pw-toggle" id="pw-toggle" type="button" aria-pressed="false" data-i18n-title="login.show" title="Show password">
        <svg class="eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
        <svg class="eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M17.9 17.9A10.5 10.5 0 0 1 12 19c-6.5 0-10-7-10-7a18.6 18.6 0 0 1 5.1-5.9"/><path d="M9.9 4.2A9.6 9.6 0 0 1 12 4c6.5 0 10 7 10 7a18.5 18.5 0 0 1-2.2 3.2"/><path d="M14.1 14.1a3 3 0 1 1-4.2-4.2"/><path d="m2 2 20 20"/></svg>
      </button>
    </label>
    <div class="login-err" id="login-err" role="alert" aria-live="polite"></div>

    <button class="btn lg login-submit" id="login-submit" type="submit" data-i18n="login.submit">Sign in</button>

    <button class="btn ghost sm login-lang" id="login-lang" type="button"><span id="login-langlabel">עברית</span></button>
  </form>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
